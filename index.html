<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nkululeko Ntanzi | Full-Stack Developer & Systems Architect</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body class="bg-[#fcfcfc] text-[#111111] font-sans antialiased selection:bg-black selection:text-white">

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto px-6 lg:px-12">
    <!-- Dynamic Hero Section -->
    <div id="hero-root"></div>

    <!-- Dynamic Projects Section -->
    <section id="projects" class="py-20 border-t border-black/10">
      <div class="mb-12">
        <span class="text-blue-600 font-mono text-xs tracking-widest uppercase font-bold">Production Systems</span>
        <h2 class="text-3xl sm:text-4xl font-black text-black mt-1 uppercase tracking-tight">Featured Architecture & Software Works</h2>
        <p class="text-gray-600 mt-2 font-sans">Full-stack applications, automated pipelines, and operational tools built from scratch.</p>
      </div>
      <div id="projects-root"></div>
    </section>

    <!-- Dynamic Skills & Tech Stack Matrix -->
    <section id="skills" class="py-20 border-t border-black/10">
      <div id="skills-root"></div>
      
  </main>

  <!-- Footer -->
  <footer class="border-t border-black/20 py-10 text-center text-xs text-gray-500 font-mono uppercase tracking-widest mt-20">
    <p>&copy; 2026 Nkululeko Ntanzi.Systems Architecture.</p>
  </footer>

  <!-- Main JavaScript Controller Entry Point -->
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
